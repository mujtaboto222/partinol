<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Ceph — Launching</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Raleway:wght@300&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'Inter', sans-serif;
    color: #f0f0f0;
    text-align: center;
    /* same background as the app */
    background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(59,184,240,.08) 0%, transparent 70%), #0a0a0a;
  }

  /* full logo; "lighten" hides the logo's black background on the dark page */
  .logo { width: min(420px, 85vw); height: auto; display: block; margin: 0 auto 32px; mix-blend-mode: lighten; }

  .status {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'DM Mono', monospace; font-size: .7rem; letter-spacing: .12em;
    color: #3bb8f0; text-transform: uppercase;
    border: 1px solid rgba(59,184,240,.3); background: rgba(59,184,240,.08);
    padding: 6px 14px; border-radius: 20px; margin-bottom: 22px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #3bb8f0; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; transform: scale(1.4); } }

  h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 10px; }
  p  { color: #888; font-size: .85rem; line-height: 1.7; max-width: 380px; margin: 0 auto 28px; }

  /* simple moving bar */
  .bar { width: 220px; height: 2px; background: #222; border-radius: 2px; margin: 0 auto 32px; overflow: hidden; }
  .bar div { width: 40%; height: 100%; background: linear-gradient(90deg, #6440ff, #3bb8f0); animation: slide 1.8s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

  a { color: #666; font-size: .7rem; text-decoration: none; }
  a:hover { color: #3bb8f0; }
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Pixel Ceph">

    <div class="status"><span class="dot"></span>Launching</div>

    <h1>Pixel Ceph is getting ready</h1>
    <p>The free version is now closed. The full version is launching soon.</p>

    <div class="bar"><div></div></div>

    <a href="https://orthotimes.net">orthotimes.net</a>
  </main>
</body>
</html>
